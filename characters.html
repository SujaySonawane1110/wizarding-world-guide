<!DOCTYPE html>
<html>
<head>
    <title>CHARACTERS</title>
    <link rel="stylesheet" href="character.css">
    <script src="character.js"></script>
    
    <!-- Existing Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=IM+Fell+DW+Pica+SC&family=IM+Fell+French+Canon+SC&family=MedievalSharp&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Wizpedia Standard Header -->
    <div id="head">
        <img src="images/wizpedia_head.jpeg" alt="Wizpedia Header">
    </div>
    <nav class="navbar1">
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="#">CHARACTERS</a></li>
            <li><a href="places.html">PLACES</a></li>
            <li><a href="magic.html">MAGIC</a></li>
            <li><a href="artifacts1.html">ARTIFACTS</a></li>
        </ul>
    </nav>

    <!-- Search Bar (Fully Preserved) -->
    <div class="search-area">
        <label>Who are you searching for today?</label>
        <input type="text" id="searchBox" placeholder="Type for the character here">
        <button onclick="checkSearch()">Search</button>
    </div>

    <!-- Character Groups Hub Carousel Container -->
    <div class="carousel-container">
        <header class="carousel-header">
            <h1 class="hub-title">CHARACTER GROUPS HUB</h1>
            <p class="hub-subtitle">Explore the factions, communities, and entities of the Wizarding World</p>
        </header>

        <div class="carousel-wrapper">
            <!-- Navigation Left Arrow -->
            <button class="carousel-btn prev-btn" id="prevBtn" onclick="moveSlide(-1)">&#8249;</button>
            
            <div class="carousel-viewport" id="carouselViewport">
                <div class="carousel-track" id="carouselTrack">
                    <!-- 1. The Golden Trio -->
                    <a href="trio.html" class="carousel-card" data-name="The Golden Trio">
                        <div class="card-image-wrapper">
                            <img src="images/group_trio.png" alt="The Golden Trio">
                        </div>
                    </a>

                    <!-- 2. Hogwarts Staff -->
                    <a href="staff.html" class="carousel-card" data-name="Hogwarts Staff">
                        <div class="card-image-wrapper">
                            <img src="images/group_staff.png" alt="Hogwarts Staff">
                        </div>
                    </a>

                    <!-- 3. Students -->
                    <a href="students.html" class="carousel-card" data-name="Students">
                        <div class="card-image-wrapper">
                            <img src="images/group_students.png" alt="Students">
                        </div>
                    </a>

                    <!-- 4. Dumbledore's Army -->
                    <a href="da.html" class="carousel-card" data-name="Dumbledore's Army">
                        <div class="card-image-wrapper">
                            <img src="images/group_da.png" alt="Dumbledore's Army">
                        </div>
                    </a>

                    <!-- 5. The Order of the Phoenix -->
                    <a href="order.html" class="carousel-card" data-name="The Order of the Phoenix">
                        <div class="card-image-wrapper">
                            <img src="images/group_order.png" alt="The Order of the Phoenix">
                        </div>
                    </a>

                    <!-- 6. Death Eaters -->
                    <a href="death-eaters.html" class="carousel-card" data-name="Death Eaters">
                        <div class="card-image-wrapper">
                            <img src="images/group_deatheaters.png" alt="Death Eaters">
                        </div>
                    </a>

                    <!-- 7. Ministry of Magic -->
                    <a href="ministry.html" class="carousel-card" data-name="Ministry of Magic">
                        <div class="card-image-wrapper">
                            <img src="images/10-Things-About-the-Ministry-of-Magic-F.avif" alt="Ministry of Magic">
                        </div>
                    </a>

                    <!-- 8. Ghosts & Spirits -->
                    <a href="ghosts.html" class="carousel-card" data-name="Ghosts & Spirits">
                        <div class="card-image-wrapper">
                            <img src="images/baron.jpeg" alt="Ghosts & Spirits">
                        </div>
                    </a>

                    <!-- 9. Legends -->
                    <a href="legends.html" class="carousel-card" data-name="Legends">
                        <div class="card-image-wrapper">
                            <img src="images/merlin.jpeg" alt="Legends">
                        </div>
                    </a>

                    <!-- 10. Residents -->
                    <a href="residents.html" class="carousel-card" data-name="Residents">
                        <div class="card-image-wrapper">
                            <img src="images/Leaky_Cauldron.webp" alt="Residents">
                        </div>
                    </a>

                    <!-- 11. Other Beings -->
                    <a href="beings.html" class="carousel-card" data-name="Other Beings">
                        <div class="card-image-wrapper">
                            <img src="images/fawkes.jpeg" alt="Other Beings">
                        </div>
                    </a>
                </div>
            </div>

            <!-- Navigation Right Arrow -->
            <button class="carousel-btn next-btn" id="nextBtn" onclick="moveSlide(1)">&#8250;</button>
        </div>

        <!-- Group name displayed under the active card -->
        <div id="active-group-name">The Golden Trio</div>
        
        <div class="ornate-divider"></div>
    </div>
</body>
</html>
